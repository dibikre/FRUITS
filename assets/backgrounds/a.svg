<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#141D2B" />
    </linearGradient>
    <pattern id="dots" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="#007ACC" opacity="0.2" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg_gradient)" />
  <rect width="100%" height="100%" fill="url(#dots)" />
  
  <!-- Decorative subtle curves -->
  <path d="M0,200 Q 500,150 1000,300 V800 H0 Z" fill="#0066BB" opacity="0.02" />
  <path d="M0,400 Q 500,450 1000,350 V800 H0 Z" fill="#004080" opacity="0.03" />
