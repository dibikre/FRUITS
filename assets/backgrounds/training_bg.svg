<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#141D2B" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#007ACC" stroke-width="0.5" opacity="0.1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg_gradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Network-like pattern suggesting AI/ML -->
  <g opacity="0.04">
    <circle cx="300" cy="200" r="5" fill="#00BFFF" />
    <circle cx="400" cy="300" r="5" fill="#00BFFF" />
    <circle cx="600" cy="250" r="5" fill="#00BFFF" />
    <circle cx="500" cy="400" r="5" fill="#00BFFF" />
    <circle cx="700" cy="350" r="5" fill="#00BFFF" />
    <circle cx="800" cy="450" r="5" fill="#00BFFF" />
    
    <line x1="300" y1="200" x2="400" y2="300" stroke="#00BFFF" stroke-width="2" />
    <line x1="400" y1="300" x2="600" y2="250" stroke="#00BFFF" stroke-width="2" />
    <line x1="400" y1="300" x2="500" y2="400" stroke="#00BFFF" stroke-width="2" />
    <line x1="600" y1="250" x2="500" y2="400" stroke="#00BFFF" stroke-width="2" />
    <line x1="600" y1="250" x2="700" y2="350" stroke="#00BFFF" stroke-width="2" />
    <line x1="500" y1="400" x2="700" y2="350" stroke="#00BFFF" stroke-width="2" />
    <line x1="700" y1="350" x2="800" y2="450" stroke="#00BFFF" stroke-width="2" />
  </g>
</svg>
