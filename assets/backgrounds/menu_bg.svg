    <circle cx="80" cy="300" r="3"/>
    <circle cx="120" cy="340" r="3"/>
    <circle cx="160" cy="380" r="3"/>
    <circle cx="200" cy="420" r="3"/>
    <circle cx="60" cy="460" r="3"/>
    <circle cx="100" cy="500" r="3"/>
    <circle cx="140" cy="540" r="3"/>
    <circle cx="180" cy="580" r="3"/>
    <circle cx="220" cy="620" r="3"/>
    <circle cx="80" cy="660" r="3"/>
